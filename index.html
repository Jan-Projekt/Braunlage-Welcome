<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark only">
<meta name="theme-color" content="#000000">
<title>Braunlage Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --card:#0b0d10;
    --card-border:rgba(255,255,255,0.08);
    --accent:#3ddc97;
    --accent2:#4fa3ff;
    --accent3:#ff9f5a;
    --text:#f2f4f6;
    --muted:#8a92a0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{ background:#000 !important; color-scheme:dark; }
  html,body{
    width:100%;height:100%;
    background:#000 !important;
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
    cursor:none;
  }
  body{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:2.2vw 2.4vw;
  }
  /* Falls JavaScript nicht läuft: deutlicher Hinweis statt stiller weißer Fläche */
  noscript{
    position:fixed; inset:0; z-index:999;
    background:#000; color:#ff9f5a;
    display:flex; align-items:center; justify-content:center;
    font-size:1.6vw; text-align:center; padding:4vw;
  }
  /* Hochformat-Warnung – Dashboard ist für Querformat gebaut */
  .rotate-warning{
    display:none;
    position:fixed; inset:0; z-index:998;
    background:#000; color:#f2f4f6;
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:8vw; gap:1.2rem;
  }
  @media (orientation:portrait){
    .rotate-warning{ display:flex; }
    main, footer{ display:none !important; }
  }
  @media print{
    @page{ size:landscape; margin:0; }
    html,body{
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color-adjust:exact !important;
    }
  }
  /* ambient glow background */
  .glow{
    position:fixed;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.16;
    z-index:0;
    pointer-events:none;
  }
  .glow.a{ width:40vw; height:40vw; top:-15vw; left:-10vw; background:var(--accent2); }
  .glow.b{ width:35vw; height:35vw; bottom:-15vw; right:-10vw; background:var(--accent); }
  .glow.c{ width:25vw; height:25vw; top:40%; left:60%; background:var(--accent3); opacity:0.08; }
  /* Layout bewusst mit Flexbox statt CSS-Grid-Autoplacement gebaut,
     damit es auch auf schwächeren/eingebauten Browsern (z.B. Beamer-App) zuverlässig
     nicht überlappt. */
  main{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:1.2vw;
    min-height:0;
  }
  .row1{
    display:flex;
    flex-direction:row;
    gap:1.4vw;
    flex:1;
    min-height:0;
  }
  .row1 > .card{ min-width:0; }
  #weatherCard{ flex:1; }
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.01));
    border:1px solid var(--card-border);
    border-radius:1.4vw;
    padding:2.2vw 2.4vw;
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow:hidden; /* Sicherheitsnetz: Inhalt wird notfalls sauber abgeschnitten statt zu überlappen */
    backdrop-filter:blur(10px);
    box-shadow:0 0 0 1px rgba(255,255,255,0.02), 0 20px 60px rgba(0,0,0,0.5);
  }
  .card-title{
    display:flex;
    align-items:center;
    gap:.6vw;
    font-size:1.3vw;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    margin-bottom:1vw;
    flex:0 0 auto;
  }
  .card-title .dot{
    width:.55vw;height:.55vw;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
  }
  .card-title .dot.live{
    background:#ff4d4f;
    box-shadow:0 0 10px #ff4d4f;
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:.35; }
  }
  /* WEATHER
     Wichtig: alle drei Zeilen (Jetzt / Tagesverlauf / Vorschau) haben bewusst
     KONSERVATIVE, feste Größen, die mit deutlichem Sicherheitsabstand in die
     Karte passen — lieber etwas Luft am Ende der Karte als abgeschnittener
     oder überlappender Text. Wenn noch sichtbar Platz übrig ist, lieber
     nochmal in kleinen Schritten vergrößern statt wieder alles auf einmal. */
  .weather-now{
    display:flex;
    align-items:center;
    gap:1.4vw;
    padding-bottom:1.4vw;
    border-bottom:1px solid var(--card-border);
    flex:0 0 auto;
  }
  .weather-now .icon{
    font-size:8vw;
    line-height:1;
    filter:drop-shadow(0 0 20px rgba(255,255,255,0.08));
  }
  .weather-now .temp{
    font-size:6.6vw;
    font-weight:700;
    line-height:1;
  }
  .weather-now .temp sup{
    font-size:2.5vw;
    font-weight:500;
    color:var(--muted);
  }
  .weather-now .desc{
    font-size:1.75vw;
    color:var(--text);
    margin-top:.3vw;
  }
  .weather-now .meta{
    font-size:1.2vw;
    color:var(--muted);
    margin-top:.5vw;
    display:flex;
    gap:1.3vw;
  }
  /* Tagesverlauf: Vormittag / Mittag / Abend — feste, kompakte Höhe */
  .dayparts{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1vw;
    flex:0 0 auto;
  }
  .daypart{
    background:rgba(255,255,255,0.03);
    border:1px solid var(--card-border);
    border-radius:1vw;
    padding:1.6vw .8vw;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:.55vw;
  }
  .daypart .d{
    font-size:1.05vw;
    color:var(--accent3);
    text-transform:uppercase;
    letter-spacing:.05em;
    font-weight:600;
  }
  .daypart .ic{ font-size:3vw; }
  .daypart .hi{ font-size:1.7vw; font-weight:700; }
  /* 3-Tage-Vorschau */
  .forecast{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1vw;
    flex:0 0 auto;
  }
  .fday{
    background:rgba(255,255,255,0.03);
    border:1px solid var(--card-border);
    border-radius:1vw;
    padding:1.7vw .8vw;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:.55vw;
  }
  .fday .d{
    font-size:1.1vw;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.05em;
    font-weight:600;
  }
  .fday .ic{ font-size:3.3vw; }
  .fday .hi{ font-size:1.8vw; font-weight:700; }
  .fday .lo{ font-size:1.4vw; color:var(--muted); }
  /* Vier Blöcke (Titel/Jetzt/Tagesverlauf/Vorschau) werden gleichmäßig über die
     volle Kartenhöhe verteilt, damit der jetzt viel größere Platz (kein Header
     mehr oben, keine Kamera daneben) auch wirklich ausgefüllt wird statt als
     Leerraum stehen zu bleiben. */
  #weatherCard{ justify-content:space-between; }
  /* NEWS-TICKER (unten, läuft durch) */
  .ticker-card{
    flex:0 0 auto;
    width:100%;
    background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.01));
    border:1px solid var(--card-border);
    border-radius:1.2vw;
    padding:.7vw 0;
    display:flex;
    align-items:center;
    gap:1vw;
    overflow:hidden;
    flex:0 0 auto;
  }
  .ticker-label{
    flex:0 0 auto;
    padding:0 1.4vw;
    font-size:1vw;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--accent2);
    border-right:1px solid var(--card-border);
    white-space:nowrap;
  }
  .ticker-viewport{
    flex:1;
    min-width:0;
    overflow:hidden;
  }
  .ticker-track{
    display:flex;
    align-items:center;
    width:max-content;
    animation:ticker-ltr 110s linear infinite;
  }
  .ticker-track.paused{ animation-play-state:paused; }
  @keyframes ticker-ltr{
    from{ transform:translateX(-50%); }
    to{ transform:translateX(0%); }
  }
  .ticker-item{
    display:inline-flex;
    align-items:center;
    gap:.5vw;
    font-size:1.15vw;
    white-space:nowrap;
    padding-right:3vw;
  }
  .ticker-item .tag{
    color:var(--accent2);
    font-weight:700;
    text-transform:uppercase;
    font-size:.8vw;
  }
  .ticker-item .sep{
    color:var(--muted);
    padding-right:3vw;
  }
  footer{
    position:relative;
    z-index:1;
    margin-top:1vw;
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    font-size:.85vw;
    color:var(--muted);
  }
  .footer-info{
    display:flex;
    flex-direction:column;
    gap:.25vw;
  }
  .updated{ opacity:.8; }
  .footer-clock{
    text-align:right;
    flex:0 0 auto;
  }
  .footer-clock .clock{
    font-size:2.3vw;
    font-weight:700;
    line-height:1;
    color:var(--text);
    letter-spacing:.01em;
    font-variant-numeric:tabular-nums;
  }
  .footer-clock .greeting{
    font-size:.9vw;
    font-weight:600;
    color:var(--accent);
    margin-top:.3vw;
  }
  .footer-clock .datestr{
    font-size:.8vw;
    color:var(--muted);
    font-weight:600;
    margin-top:.15vw;
    text-transform:capitalize;
  }
</style>
</head>
<body>
  <noscript>Dieses Dashboard braucht aktiviertes JavaScript. Bitte in den Browser-Einstellungen aktivieren und neu laden.</noscript>
  <div class="rotate-warning">
    <div style="font-size:4vw;">↻</div>
    <div style="font-size:1.6vw;font-weight:600;">Bitte Gerät ins Querformat drehen</div>
    <div style="font-size:1vw;color:#8a92a0;">Dieses Dashboard ist für die Anzeige im Querformat (Landscape) gebaut.</div>
  </div>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="glow c"></div>
  <main>
    <div class="row1">
      <section class="card" id="weatherCard">
        <div class="card-title"><span class="dot"></span> Wetter</div>
        <div class="weather-now" id="weatherNow">
          <div class="icon" id="wIcon">⋯</div>
          <div>
            <div class="temp" id="wTemp">--<sup>°C</sup></div>
            <div class="desc" id="wDesc">Lade Wetterdaten…</div>
            <div class="meta" id="wMeta"></div>
          </div>
        </div>
        <div class="dayparts" id="dayparts"></div>
        <div class="forecast" id="forecast"></div>
      </section>
    </div>
    <div class="ticker-card" id="tickerCard">
      <div class="ticker-label">Tagesschau</div>
      <div class="ticker-viewport">
        <div class="ticker-track" id="tickerTrack">
          <span class="ticker-item">Lade aktuelle Nachrichten…</span>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <div class="footer-info">
      <div>Automatische Aktualisierung · Wetter alle 15 Min · News alle 5 Min · Uhrzeit-Sync stündlich</div>
      <div class="updated" id="updated"></div>
    </div>
    <div class="footer-clock">
      <div class="clock" id="clock">--:--</div>
      <div class="greeting" id="greeting">Hallo, Jan</div>
      <div class="datestr" id="datestr">wird geladen…</div>
    </div>
  </footer>
<script>
  // ---------- CLOCK ----------
  // Uhrzeit kommt bewusst NICHT von der Systemuhr des Anzeigegeräts, sondern wird
  // per Zeit-API aus dem Internet geholt (falls das Gerät z.B. keine korrekte
  // Systemzeit/Zeitzone hat). Wir merken uns die Differenz zur lokalen Uhr
  // (timeOffsetMs) und rechnen die danach jede Sekunde einfach oben drauf,
  // statt dauerhaft zu pollen. Stündlicher Re-Sync gleicht eventuelle Drift aus.
  let timeOffsetMs = 0;
  const months = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  function pad(n){ return n.toString().padStart(2,'0'); }
  function greetingFor(hour){
    if(hour >= 5 && hour < 11) return 'Guten Morgen, Jan';
    if(hour >= 11 && hour < 18) return 'Hallo, Jan';
    return 'Guten Abend, Jan';
  }
  // Anzeige bewusst IMMER über Intl mit fest eingestellter timeZone:'Europe/Berlin'
  // formatiert – dadurch ist die Anzeige unabhängig davon, wie die
  // Systemzeitzone des Anzeigegeräts eingestellt ist (das war der eigentliche Bug:
  // vorher wurden die von der Zeit-API gelieferten Zahlen mit new Date(y,m,d,h,min,s)
  // als Gerätezeitzone interpretiert statt als Europe/Berlin — bei falsch eingestelltem
  // Gerät kam dann eine falsche Uhrzeit raus).
  const berlinPartsFmt = new Intl.DateTimeFormat('de-DE', {
    timeZone:'Europe/Berlin',
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', hour12:false
  });
  const berlinWeekdayFmt = new Intl.DateTimeFormat('de-DE', { timeZone:'Europe/Berlin', weekday:'long' });
  function berlinParts(date){
    const o = {};
    berlinPartsFmt.formatToParts(date).forEach(p => { if(p.type !== 'literal') o[p.type] = p.value; });
    return o;
  }
  function berlinNow(){
    const d = new Date(Date.now() + timeOffsetMs);
    const p = berlinParts(d);
    return { year:+p.year, month:+p.month, day:+p.day, hour:+p.hour, minute:+p.minute, raw:d };
  }
  function updateClock(){
    const now = berlinNow();
    document.getElementById('clock').textContent = pad(now.hour) + ':' + pad(now.minute);
    document.getElementById('datestr').textContent =
      berlinWeekdayFmt.format(now.raw) + ', ' + now.day + '. ' + months[now.month - 1] + ' ' + now.year;
    document.getElementById('greeting').textContent = greetingFor(now.hour);
  }
  // Zeit-Sync: fragt bewusst die UTC-Zeit ab (nicht direkt Europe/Berlin), damit die
  // Berechnung des Offsets zu Date.now() komplett zeitzonen-unabhängig ist (Date.UTC
  // liefert einen eindeutigen Zeitstempel, unabhängig von der Gerätezeitzone). Zwei
  // unabhängige Anbieter als Fallback, falls einer der beiden mal down ist.
  async function syncTime(){
    try{
      const res = await fetchWithTimeout('https://timeapi.io/api/Time/current/zone?timeZone=UTC', 8000);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const serverUtcMs = Date.UTC(data.year, data.month - 1, data.day, data.hour, data.minute, data.seconds, data.milliSeconds || 0);
      if(isNaN(serverUtcMs)) throw new Error('Ungültige Zeitantwort (timeapi.io)');
      timeOffsetMs = serverUtcMs - Date.now();
      return;
    }catch(e){
      console.warn('Zeit-Sync über timeapi.io fehlgeschlagen, versuche Fallback', e);
    }
    try{
      const res2 = await fetchWithTimeout('https://worldtimeapi.org/api/timezone/Etc/UTC', 8000);
      if(!res2.ok) throw new Error('HTTP ' + res2.status);
      const data2 = await res2.json();
      if(typeof data2.unixtime !== 'number') throw new Error('Ungültige Zeitantwort (worldtimeapi.org)');
      timeOffsetMs = (data2.unixtime * 1000) - Date.now();
    }catch(e2){
      console.error('Zeit-Sync komplett fehlgeschlagen, nutze zuletzt bekannten Offset', e2);
    }
  }
  syncTime();
  updateClock();
  setInterval(updateClock, 1000);
  setInterval(syncTime, 60 * 60 * 1000);
  // ---------- WEATHER ----------
  const WMO = {
    0:['☀️','Klarer Himmel'], 1:['🌤️','Überwiegend klar'], 2:['⛅','Teilweise bewölkt'], 3:['☁️','Bedeckt'],
    45:['🌫️','Nebel'], 48:['🌫️','Reifnebel'],
    51:['🌦️','Leichter Niesel'], 53:['🌦️','Niesel'], 55:['🌧️','Starker Niesel'],
    56:['🌧️','Gefrierender Niesel'], 57:['🌧️','Starker gefr. Niesel'],
    61:['🌧️','Leichter Regen'], 63:['🌧️','Regen'], 65:['🌧️','Starker Regen'],
    66:['🌧️','Gefrierender Regen'], 67:['🌧️','Starker gefr. Regen'],
    71:['🌨️','Leichter Schneefall'], 73:['🌨️','Schneefall'], 75:['❄️','Starker Schneefall'],
    77:['❄️','Schneegriesel'],
    80:['🌦️','Leichte Schauer'], 81:['🌧️','Schauer'], 82:['⛈️','Heftige Schauer'],
    85:['🌨️','Schneeschauer'], 86:['❄️','Starke Schneeschauer'],
    95:['⛈️','Gewitter'], 96:['⛈️','Gewitter mit Hagel'], 99:['⛈️','Schweres Gewitter']
  };
  function wmoInfo(code){ return WMO[code] || ['🌡️','Unbekannt']; }
  const shortDay = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  function fetchWithTimeout(url, ms=10000){
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(t));
  }
  // Open-Meteo liefert die Stunden-Zeitstempel als reinen Text ohne Zeitzonen-Offset
  // (z.B. "2026-08-13T09:00"), bereits in Europe/Berlin (siehe timezone=Europe%2FBerlin
  // im Request). Wir parsen das bewusst als Text statt über new Date(...), sonst würde
  // JS die Zahlen wieder fälschlich als Gerätezeitzone interpretieren.
  function hourlyIndexForToday(hourlyTimes, hour){
    const now = berlinNow();
    for(let i=0;i<hourlyTimes.length;i++){
      const t = hourlyTimes[i];
      const y = +t.slice(0,4), mo = +t.slice(5,7), da = +t.slice(8,10), hh = +t.slice(11,13);
      if(y===now.year && mo===now.month && da===now.day && hh===hour) return i;
    }
    return -1;
  }
  async function loadWeather(){
    try{
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=51.7280&longitude=10.5987&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FBerlin&forecast_days=4';
      const res = await fetchWithTimeout(url);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const cur = data.current;
      const [icon, desc] = wmoInfo(cur.weather_code);
      document.getElementById('wIcon').textContent = icon;
      document.getElementById('wTemp').innerHTML = Math.round(cur.temperature_2m) + '<sup>°C</sup>';
      document.getElementById('wDesc').textContent = desc;
      document.getElementById('wMeta').innerHTML =
        'Gefühlt ' + Math.round(cur.apparent_temperature) + '°C &nbsp;·&nbsp; Wind ' + Math.round(cur.wind_speed_10m) + ' km/h &nbsp;·&nbsp; Luftfeuchte ' + cur.relative_humidity_2m + '%';
      // Tagesverlauf heute: Vormittag / Mittag / Abend
      const hourly = data.hourly;
      const dayparts = [
        { label:'Vormittag', hour:9 },
        { label:'Mittag', hour:13 },
        { label:'Abend', hour:19 }
      ];
      const dpEl = document.getElementById('dayparts');
      dpEl.innerHTML = '';
      if(hourly && hourly.time){
        dayparts.forEach(dp => {
          const idx = hourlyIndexForToday(hourly.time, dp.hour);
          const div = document.createElement('div');
          div.className = 'daypart';
          if(idx >= 0){
            const [dpIcon] = wmoInfo(hourly.weather_code[idx]);
            div.innerHTML = `
              <div class="d">${dp.label}</div>
              <div class="ic">${dpIcon}</div>
              <div class="hi">${Math.round(hourly.temperature_2m[idx])}°</div>
            `;
          } else {
            div.innerHTML = `<div class="d">${dp.label}</div><div class="ic">—</div>`;
          }
          dpEl.appendChild(div);
        });
      }
      // 3-Tage-Vorschau (ohne heute)
      const daily = data.daily;
      const forecastEl = document.getElementById('forecast');
      forecastEl.innerHTML = '';
      for(let i=1;i<Math.min(daily.time.length,4);i++){
        // Datumsstring (z.B. "2026-08-14") bewusst per Hand geparst und mit getUTCDay()
        // statt getDay() ausgewertet, damit die Gerätezeitzone auch hier keine Rolle spielt.
        const [dy, dm, dd] = daily.time[i].split('-').map(Number);
        const weekdayIdx = new Date(Date.UTC(dy, dm - 1, dd)).getUTCDay();
        const [dicon] = wmoInfo(daily.weather_code[i]);
        const div = document.createElement('div');
        div.className = 'fday';
        div.innerHTML = `
          <div class="d">${shortDay[weekdayIdx]}</div>
          <div class="ic">${dicon}</div>
          <div class="hi">${Math.round(daily.temperature_2m_max[i])}°</div>
          <div class="lo">${Math.round(daily.temperature_2m_min[i])}°</div>
        `;
        forecastEl.appendChild(div);
      }
      bumpUpdated();
    }catch(e){
      const reason = e.name === 'AbortError' ? 'Zeitüberschreitung – keine Internetverbindung?' : e.message;
      document.getElementById('wDesc').textContent = 'Wetter nicht verfügbar (' + reason + ')';
      console.error(e);
    }
  }
  // ---------- NEWS-TICKER ----------
  async function loadNews(){
    try{
      const res = await fetchWithTimeout('https://www.tagesschau.de/api2u/homepage/');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const items = (data.news || []).filter(n => n.title && n.title.trim().length > 0).slice(0, 10);
      const track = document.getElementById('tickerTrack');
      if(items.length === 0){
        track.innerHTML = '<span class="ticker-item">Keine Nachrichten gefunden</span>';
        return;
      }
      const single = items.map(n => {
        const tag = (n.tag || n.ressort || 'News').toString();
        return `<span class="ticker-item"><span class="tag">${tag}</span> ${n.title}</span><span class="sep">●</span>`;
      }).join('');
      // Inhalt zweimal hintereinander für nahtlose Endlosschleife (CSS-Animation
      // verschiebt um -50%, danach ist Kopie 2 exakt an der Stelle von Kopie 1).
      track.innerHTML = single + single;
      bumpUpdated();
    }catch(e){
      const reason = e.name === 'AbortError' ? 'Zeitüberschreitung – keine Internetverbindung?' : e.message;
      document.getElementById('tickerTrack').innerHTML =
        '<span class="ticker-item">Nachrichten nicht verfügbar (' + reason + ')</span>';
      console.error(e);
    }
  }
  function bumpUpdated(){
    const now = berlinNow();
    document.getElementById('updated').textContent = 'Zuletzt aktualisiert: ' + pad(now.hour) + ':' + pad(now.minute);
  }
  loadWeather();
  loadNews();
  setInterval(loadWeather, 15 * 60 * 1000);
  setInterval(loadNews, 5 * 60 * 1000);
</script>
</body>
</html>
